name: Demo Integration

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify released starter 0.2.2 resolves
        run: mvn -B -U dependency:get -Dartifact=io.github.mathias82.spring.kafka:spring-kafka-contract-starter:0.2.2

      - name: Start Kafka and Schema Registry
        run: docker compose up -d

      - name: Wait for schema initialization
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose ps -q schema-init)"
          for attempt in {1..60}; do
            status="$(docker inspect -f '{{.State.Status}}' "$container_id")"
            if [ "$status" = "exited" ]; then
              exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$container_id")"
              if [ "$exit_code" = "0" ]; then
                exit 0
              fi
              docker compose logs schema-init
              exit "$exit_code"
            fi
            sleep 2
          done
          echo "schema-init did not complete in time"
          docker compose logs
          exit 1

      - name: Build demo
        run: mvn -B clean package

      - name: Verify contract scenarios and Kafka round trip
        run: bash scripts/verify-contract-scenarios.sh

      - name: Print logs on failure
        if: failure()
        run: |
          for log in scenario-v1.log scenario-v2.log scenario-v3.log; do
            if [ -f "$log" ]; then
              echo "===== $log ====="
              cat "$log"
            fi
          done
          docker compose logs || true

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
