services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092

  schema-init:
    image: curlimages/curl:8.5.0
    depends_on:
      - schema-registry
    volumes:
      - ./schemas:/schemas:ro
    command:
      - sh
      - -ec
      - |
        echo "Waiting for Schema Registry..."
        until curl --fail --silent http://schema-registry:8081/subjects >/dev/null; do
          sleep 2
        done

        echo "Setting BACKWARD compatibility..."
        curl --fail --silent --show-error -X PUT \
          -H "Content-Type: application/vnd.schemaregistry.v1+json" \
          --data '{"compatibility":"BACKWARD"}' \
          http://schema-registry:8081/config

        echo "Registering order-events-value v1..."
        curl --fail --silent --show-error -X POST \
          -H "Content-Type: application/vnd.schemaregistry.v1+json" \
          --data @/schemas/order-event.json \
          http://schema-registry:8081/subjects/order-events-value/versions

        echo "Schema Registry initialization complete."
